installed: []
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    prompt: 是否执行 speckit.git.initialize？
    description: 在初始化宪法前初始化 Git 仓库
    condition: null
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    prompt: 是否执行 speckit.git.feature？
    description: 在编写规格前创建功能分支
    condition: null
  before_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在澄清规格前提交当前修改？
    description: 在规格澄清前自动提交
    condition: null
  before_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在实施计划前提交当前修改？
    description: 在实施计划前自动提交
    condition: null
  before_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在生成任务前提交当前修改？
    description: 在生成任务前自动提交
    condition: null
  before_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在实现前提交当前修改？
    description: 在实现前自动提交
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在生成检查清单前提交当前修改？
    description: 在生成检查清单前自动提交
    condition: null
  before_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在分析前提交当前修改？
    description: 在分析前自动提交
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在同步 issue 前提交当前修改？
    description: 在 tasks-to-issues 转换前自动提交
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交宪法修改？
    description: 在宪法更新后自动提交
    condition: null
  after_specify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交规格修改？
    description: 在规格生成后自动提交
    condition: null
  after_clarify:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交规格澄清修改？
    description: 在规格澄清后自动提交
    condition: null
  after_plan:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交计划修改？
    description: 在实施计划后自动提交
    condition: null
  after_tasks:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交任务修改？
    description: 在任务生成后自动提交
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交实现修改？
    description: 在实现后自动提交
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交检查清单修改？
    description: 在检查清单生成后自动提交
    condition: null
  after_analyze:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否提交分析结果？
    description: 在分析后自动提交
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: 是否在同步 issue 后提交？
    description: 在 tasks-to-issues 转换后自动提交
    condition: null
