# Git 分支工作流扩展配置
# 安装时会复制到 .specify/extensions/git/git-config.yml

# 分支编号策略："sequential"（001、002、...）或 "timestamp"（YYYYMMDD-HHMMSS）
branch_numbering: sequential

# 仓库初始化时使用的提交信息
init_commit_message: "[Spec Kit] 初始提交"

# 核心命令前后的自动提交配置。
# 设置 default 可控制所有命令，再按具体命令覆盖。
# 每个 key 可设置 true/false，并可单独配置提交信息。
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] 规格澄清前保存进度"
  before_plan:
    enabled: false
    message: "[Spec Kit] 计划前保存进度"
  before_tasks:
    enabled: false
    message: "[Spec Kit] 任务生成前保存进度"
  before_implement:
    enabled: false
    message: "[Spec Kit] 实现前保存进度"
  before_checklist:
    enabled: false
    message: "[Spec Kit] 检查清单前保存进度"
  before_analyze:
    enabled: false
    message: "[Spec Kit] 分析前保存进度"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] issue 同步前保存进度"
  after_constitution:
    enabled: false
    message: "[Spec Kit] 新增项目宪法"
  after_specify:
    enabled: false
    message: "[Spec Kit] 新增规格"
  after_clarify:
    enabled: false
    message: "[Spec Kit] 澄清规格"
  after_plan:
    enabled: false
    message: "[Spec Kit] 新增实施计划"
  after_tasks:
    enabled: false
    message: "[Spec Kit] 新增任务"
  after_implement:
    enabled: false
    message: "[Spec Kit] 实现进度"
  after_checklist:
    enabled: false
    message: "[Spec Kit] 新增检查清单"
  after_analyze:
    enabled: false
    message: "[Spec Kit] 新增分析报告"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] 同步任务到 issue"
