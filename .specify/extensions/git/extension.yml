schema_version: "1.0"

extension:
  id: git
  name: "Git 分支工作流"
  version: "1.0.0"
  description: "功能分支创建、编号、校验和 Git 远端识别"
  author: spec-kit-core
  repository: https://github.com/github/spec-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.git.feature
      file: commands/speckit.git.feature.md
      description: "创建顺序编号或时间戳编号的功能分支"
    - name: speckit.git.validate
      file: commands/speckit.git.validate.md
      description: "校验当前分支是否符合功能分支命名约定"
    - name: speckit.git.remote
      file: commands/speckit.git.remote.md
      description: "识别 Git 远端 URL，供 GitHub 集成使用"
    - name: speckit.git.initialize
      file: commands/speckit.git.initialize.md
      description: "初始化 Git 仓库并创建初始提交"
    - name: speckit.git.commit
      file: commands/speckit.git.commit.md
      description: "在 Spec Kit 命令完成后自动提交修改"

  config:
    - name: "git-config.yml"
      template: "config-template.yml"
      description: "Git 分支配置"
      required: false

hooks:
  before_constitution:
    command: speckit.git.initialize
    optional: false
    description: "在初始化宪法前初始化 Git 仓库"
  before_specify:
    command: speckit.git.feature
    optional: false
    description: "在编写规格前创建功能分支"
  before_clarify:
    command: speckit.git.commit
    optional: true
    prompt: "是否在澄清规格前提交当前修改？"
    description: "在规格澄清前自动提交"
  before_plan:
    command: speckit.git.commit
    optional: true
    prompt: "是否在实施计划前提交当前修改？"
    description: "在实施计划前自动提交"
  before_tasks:
    command: speckit.git.commit
    optional: true
    prompt: "是否在生成任务前提交当前修改？"
    description: "在生成任务前自动提交"
  before_implement:
    command: speckit.git.commit
    optional: true
    prompt: "是否在实现前提交当前修改？"
    description: "在实现前自动提交"
  before_checklist:
    command: speckit.git.commit
    optional: true
    prompt: "是否在生成检查清单前提交当前修改？"
    description: "在生成检查清单前自动提交"
  before_analyze:
    command: speckit.git.commit
    optional: true
    prompt: "是否在分析前提交当前修改？"
    description: "在分析前自动提交"
  before_taskstoissues:
    command: speckit.git.commit
    optional: true
    prompt: "是否在同步 issue 前提交当前修改？"
    description: "在 tasks-to-issues 转换前自动提交"
  after_constitution:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交宪法修改？"
    description: "在宪法更新后自动提交"
  after_specify:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交规格修改？"
    description: "在规格生成后自动提交"
  after_clarify:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交规格澄清修改？"
    description: "在规格澄清后自动提交"
  after_plan:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交计划修改？"
    description: "在实施计划后自动提交"
  after_tasks:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交任务修改？"
    description: "在任务生成后自动提交"
  after_implement:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交实现修改？"
    description: "在实现后自动提交"
  after_checklist:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交检查清单修改？"
    description: "在检查清单生成后自动提交"
  after_analyze:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交分析结果？"
    description: "在分析后自动提交"
  after_taskstoissues:
    command: speckit.git.commit
    optional: true
    prompt: "是否在同步 issue 后提交？"
    description: "在 tasks-to-issues 转换后自动提交"

tags:
  - "git"
  - "branching"
  - "workflow"

config:
  defaults:
    branch_numbering: sequential
    init_commit_message: "[Spec Kit] 初始提交"
