[display]
refresh_interval_ms = 1000
stale_after_seconds = 20
reconnect_delay_seconds = 3.0
stock_poll_interval_seconds = 5

[agent]
enabled = true
timeout_seconds = 45
max_candles = 40
max_iterations = 10
use_tools = true

[agent.providers.codex]
enabled = true
model = "gpt-5.5"
reasoning_effort = "xhigh"

[agent.providers.anthropic]
enabled = true
model = "global.anthropic.claude-opus-4-6-v1"
reasoning_effort = "medium"
[analysis]
enabled = true
interval = "5m"
lookback = 40
poll_interval_seconds = 30
stale_after_seconds = 420
[news]
enabled = true
poll_interval_seconds = 30
max_interval_seconds = 600
reuters_url = "https://www.reuters.com/arc/outboundfeeds/news-sitemap/?outputType=xml"
request_timeout_seconds = 10
retention_days = 30
recent_limit = 50
[social_feed]
enabled = true
recent_limit = 100
retention_days = 30
max_items = 2000
