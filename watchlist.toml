symbols = [
  { symbol = "AAPL", source = "alpaca", label = "AAPL", group = "stocks", show_collapsed = true, analysis_interval = "5m"},
  { symbol = "SPY", source = "alpaca", label = "SPY", group = "stocks", show_collapsed = false },
  { symbol = "BTCUSDT", inst_type = "USDT-FUTURES", label = "BTC", group = "crypto", analysis_interval = "15m" },
  { symbol = "ETHUSDT", inst_type = "USDT-FUTURES", label = "ETH", group = "crypto" },
  { symbol = "XAUUSDT", inst_type = "USDT-FUTURES", label = "XAU", group = "crypto" },
  { symbol = "MSFT", source = "alpaca", label = "MSFT", group = "stocks", show_collapsed = true },
]

[display]
refresh_interval_ms = 1000
stale_after_seconds = 20
reconnect_delay_seconds = 3.0
stock_poll_interval_seconds = 5

[agent]
enabled = true
provider = "codex"
api_mode = "codex_responses"
model = "gpt-5.4"
timeout_seconds = 45
max_candles = 40
reasoning_effort = "medium"

[analysis]
enabled = true
interval = "5m"
lookback = 40
poll_interval_seconds = 30
stale_after_seconds = 420

[news]
enabled = false
poll_interval_seconds = 30
max_interval_seconds = 600
reuters_url = "https://www.reuters.com/sitemap_news.xml"
request_timeout_seconds = 10.0
retention_days = 30
recent_limit = 50
