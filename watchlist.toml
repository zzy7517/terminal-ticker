[display]
refresh_interval_ms = 1000
stale_after_seconds = 20
reconnect_delay_seconds = 3.0
stock_poll_interval_seconds = 5

[agent]
enabled = true
default_provider = "openai"
default_model = "openrouter/anthropic/claude-opus-4.7"
system_prompt = ""
max_candles = 40
candle_context_mode = "raw"

[agent.providers.codex]
enabled = false
api = "openai-codex-responses"
display_name = "codex"
requires_auth = true
models = ["gpt-5.4-mini", "gpt-5.4"]
model_efforts = {"gpt-5.5" = "high", "gpt-5.4-mini" = "medium", "gpt-5.4" = "high"}

[agent.providers.anthropic]
enabled = false
api = "anthropic-messages"
display_name = "anthropic"
requires_auth = true
api_key = "${ANTHROPIC_AUTH_TOKEN}"
base_url = "https://co.yes.vg"
models = ["claude-haiku-4-5"]
model_efforts = {"claude-haiku-4-5" = "medium"}

[agent.providers.openai]
enabled = true
api = "openai-completions"
display_name = "openai"
requires_auth = true
api_key = "${OPENAI_API_KEY}"
base_url = "https://infra-litellm-api.winktech.net"
models = ["openrouter/anthropic/claude-opus-4.7", "openrouter/anthropic/claude-opus-4.6"]
model_efforts = {"openrouter/anthropic/claude-opus-4.7" = "medium", "openrouter/anthropic/claude-opus-4.6" = "medium"}
[analysis]
enabled = true
interval = "5m"
lookback = 40
poll_interval_seconds = 30
stale_after_seconds = 420
[news]
enabled = true
poll_interval_seconds = 30
max_interval_seconds = 600
reuters_url = "https://www.reuters.com/arc/outboundfeeds/news-sitemap/?outputType=xml"
forexfactory_enabled = true
request_timeout_seconds = 10
retention_days = 30
recent_limit = 50

[trading]
bitget_mode = "demo"          # "off" | "demo" | "live"

[channels]
max_active_agents = 3
max_agents = 20
max_activation_hops = 16
activation_debounce_ms = 500
retry_max_seconds = 300

[jin10]
enabled = true
token = "${JIN10_TOKEN}"
flash_enabled = true
flash_poll_interval_seconds = 60
calendar_enabled = true
calendar_poll_interval_seconds = 300
quotes_enabled = true
quotes_poll_interval_seconds = 600
quotes_codes = ["XAUUSD", "XAGUSD", "USOIL", "EURUSD", "USDJPY", "USDCNH", "N225", "NGAS", "UKOILX", "DJI", "SPX"]
agent_analysis = false
[macro]
enabled = true
fred_api_key = "76cb1968c035e8c4b181a290932f8927"
backfill_years = 2
fred_poll_interval_seconds = 21600   # 6h; FRED updates daily at most
calendar_enabled = true
calendar_poll_interval_seconds = 300
forexfactory_calendar_enabled = true

# Deribit DVOL + Binance 持仓结构。两者都免费无需鉴权。
crypto_enabled = true
crypto_poll_interval_seconds = 300

# ICE DXY + 现货金银，即 FRED 不覆盖的那几个。配了 twelve_data_api_key 走正规
# 授权源（免费档 800/天）；留空只会回落 Yahoo 非官方端点，实测部分地区即使带
# crumb 也会 403/429，届时这三个序列会是空的。
# VIX、汇率、WTI、天然气都已走 FRED，不依赖本项；DXY 另有 FRED 的 DTWEXBGS
# （series id: dxy_broad）作日频兜底。
quotes_enabled = true
quotes_poll_interval_seconds = 21600
twelve_data_api_key = "336b82ad42814600b1c3de5135906bbb"

# Trading silence around high-impact releases (CPI / NFP / FOMC).
# min_impact: high | medium | low  — Jin10's 4-5 stars map to "high".
# block_trades = false 只上报窗口、不拦截开仓；平仓永不受限。
[macro.event_window]
min_impact = "high"
before_minutes = 15
after_minutes = 15
block_trades = true

[browser]
enabled = true
# socket_path = "/tmp/open-browser-use/example.sock"  # optional, auto-discovers by default
# timeout_ms = 15000

# ============================================================================
# Options & GEX analysis
# ============================================================================
# Enable to show the "Options" tab in the UI and feed GEX data to the agent.
# Provider options: "marketdata" (free token, full Greeks+OI/IV), "yfinance"
# (free, no key), "tradier" (free token), "deribit" (free, BTC/ETH only).
# With provider="marketdata", Yahoo Finance is the automatic no-key backup.
[options]
enabled = true
provider = "marketdata"
symbols = ["SPY", "QQQ", "GLD"]
poll_interval_seconds = 43200
strike_range_percent = 0.15

[options.marketdata]
api_key = "${MARKETDATA_API_KEY}"
base_url = "https://api.marketdata.app/v1"

[options.deribit]
enabled = true
currencies = ["BTC", "ETH"]
[proxy]
enabled = true
type = "socks5"
host = "127.0.0.1"
port = 1086
username = ""
password = ""
