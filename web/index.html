<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tradex — live markets, agents, and execution</title>
    <meta
      name="description"
      content="A trading workspace that puts live quotes, macro context, options flow, and your research agents on one screen."
    />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tradex — live markets, agents, and execution" />
    <meta
      property="og:description"
      content="A trading workspace that puts live quotes, macro context, options flow, and your research agents on one screen."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..750&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tradex-theme') === 'light' ? 'light' : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
